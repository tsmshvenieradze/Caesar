name: Release

# Two ways to publish:
#   1. Actions > Release > "Run workflow": type the version (e.g. 10.0.1). Nothing in the repo needs to change.
#      Must be run on main; the run fails if that version is already on nuget.org.
#   2. Merge to main: publishes <VersionPrefix> from Directory.Build.props. If that version already exists
#      on nuget.org the push is skipped (`--skip-duplicate`), so ordinary merges are a safe no-op.
#   3. A stable release also publishes its docs (docs.yml) and takes its GitHub Release notes from CHANGELOG.md,
#      which must have a `## [X.Y.Z]` section. Prerelease versions skip both.
#
# Authentication uses nuget.org Trusted Publishing (GitHub OIDC), so no long-lived API key is stored.
# On nuget.org: Account > Trusted Publishing > Add, with
#   Repository owner: tsmshvenieradze   Repository: Caesar
#   Workflow file:    release.yml       Environment: nuget.org
# On GitHub: create the "nuget.org" environment and add NUGET_USER = your nuget.org username (a variable or a secret).

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to publish, e.g. 10.0.1 or 10.1.0-preview.1 (overrides Directory.Build.props)'
        required: true
        type: string

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: write   # create the vX.Y.Z tag and GitHub release
  id-token: write   # request the OIDC token that nuget.org exchanges for a short-lived API key

jobs:
  release:
    runs-on: ubuntu-latest
    environment: nuget.org
    outputs:
      released: ${{ steps.tag.outputs.released }}
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Resolve package version
        id: version
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          if [ -n "$INPUT_VERSION" ]; then
            if [ "$GITHUB_REF" != "refs/heads/main" ]; then
              echo "Manual releases must be run from main (got $GITHUB_REF)." >&2; exit 1
            fi
            VERSION="$INPUT_VERSION"
            SOURCE="workflow input"
          else
            VERSION=$(sed -n 's:.*<VersionPrefix>\(.*\)</VersionPrefix>.*:\1:p' Directory.Build.props)
            SOURCE="Directory.Build.props"
          fi
          if ! printf '%s' "$VERSION" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$'; then
            echo "Invalid version '$VERSION'. Expected MAJOR.MINOR.PATCH with an optional -suffix, e.g. 10.0.1 or 10.1.0-preview.1." >&2; exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "manual=$([ -n "$INPUT_VERSION" ] && echo true || echo false)" >> "$GITHUB_OUTPUT"
          echo "Package version: $VERSION (from $SOURCE)"

      - name: Require a changelog entry for a new stable version
        id: changelog
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          if git ls-remote --exit-code --tags origin "v$VERSION" >/dev/null 2>&1; then
            echo "Tag v$VERSION already exists; no new release, changelog not required."
            exit 0
          fi
          case "$VERSION" in
            *-*) echo "Prerelease $VERSION: changelog entry optional, notes are generated."; exit 0 ;;
          esac
          if ! python3 .github/scripts/changelog_section.py CHANGELOG.md "$VERSION" > "$RUNNER_TEMP/release-notes.md"; then
            echo "CHANGELOG.md needs a '## [$VERSION]' section before $VERSION can be released." >&2
            exit 1
          fi
          echo "notes=$RUNNER_TEMP/release-notes.md" >> "$GITHUB_OUTPUT"

      - name: Fail if a manual version is already on nuget.org
        if: steps.version.outputs.manual == 'true'
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          for ID in caesar caesar.abstractions; do
            STATUS=$(curl -s -o /dev/null -w '%{http_code}' "https://api.nuget.org/v3-flatcontainer/$ID/$VERSION/$ID.nuspec")
            if [ "$STATUS" = "200" ]; then
              echo "$ID $VERSION is already published on nuget.org; pick a higher version." >&2; exit 1
            fi
          done

      - name: Restore
        run: dotnet restore Caesar.slnx

      - name: Build
        run: dotnet build Caesar.slnx --configuration Release --no-restore -p:Version=${{ steps.version.outputs.version }}

      - name: Test
        run: dotnet test Caesar.slnx --configuration Release --no-build

      - name: Pack
        run: dotnet pack Caesar.slnx --configuration Release --no-build --output artifacts/packages -p:Version=${{ steps.version.outputs.version }}

      - name: Check NUGET_USER is configured
        env:
          NUGET_USER: ${{ vars.NUGET_USER || secrets.NUGET_USER }}
        run: |
          if [ -z "$NUGET_USER" ]; then
            echo "Set NUGET_USER (your nuget.org username) as a variable or secret on the nuget.org environment." >&2
            exit 1
          fi

      - name: Log in to nuget.org (Trusted Publishing)
        id: nuget-login
        uses: NuGet/login@v1
        with:
          user: ${{ vars.NUGET_USER || secrets.NUGET_USER }}

      - name: Push to nuget.org
        env:
          NUGET_API_KEY: ${{ steps.nuget-login.outputs.NUGET_API_KEY }}
        run: |
          dotnet nuget push "artifacts/packages/*.nupkg" \
            --api-key "$NUGET_API_KEY" \
            --source https://api.nuget.org/v3/index.json \
            --skip-duplicate

      - name: Tag and create GitHub release
        id: tag
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.version.outputs.version }}
          NOTES: ${{ steps.changelog.outputs.notes }}
        run: |
          TAG="v$VERSION"
          if git rev-parse -q --verify "refs/tags/$TAG" >/dev/null || git ls-remote --exit-code --tags origin "$TAG" >/dev/null 2>&1; then
            echo "Tag $TAG already exists; skipping release creation."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag -a "$TAG" -m "Caesar $VERSION"
          git push origin "$TAG"
          if [ -n "$NOTES" ]; then NOTES_ARGS=(--notes-file "$NOTES"); else NOTES_ARGS=(--generate-notes); fi
          gh release create "$TAG" artifacts/packages/*.nupkg artifacts/packages/*.snupkg \
            --title "Caesar $VERSION" \
            "${NOTES_ARGS[@]}"
          echo "released=true" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v4
        with:
          name: packages-${{ steps.version.outputs.version }}
          path: artifacts/packages

  docs:
    needs: release
    # A tag pushed with GITHUB_TOKEN does not trigger other workflows, so publish the docs explicitly.
    if: needs.release.outputs.released == 'true' && !contains(needs.release.outputs.version, '-')
    uses: ./.github/workflows/docs.yml
    with:
      ref: v${{ needs.release.outputs.version }}
      version: ${{ needs.release.outputs.version }}
    permissions:
      contents: write
