name: Docs

# Publishes one minor version of the documentation to the gh-pages branch (served at caesar.tsezar.io).
#   - Called by release.yml after a stable release, with ref vX.Y.Z.
#   - Run by hand (Actions > Docs > Run workflow) to republish a version from any branch or tag, e.g. main -> 10.1,
#     for documentation-only fixes. Other versions on the site are never touched.
# The site is built from the requested ref with a read-only token; only the publish job, which runs nothing but the
# workflow's own publishing script, can push to gh-pages.

on:
  workflow_call:
    inputs:
      ref:
        required: true
        type: string
      version:
        required: true
        type: string
  workflow_dispatch:
    inputs:
      ref:
        description: 'Git ref to build (tag or branch), e.g. v10.1.1 or main'
        required: true
        default: main
        type: string
      version:
        description: 'Docs version to publish, X.Y or X.Y.Z (e.g. 10.1)'
        required: true
        type: string

concurrency:
  group: docs
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build:
    name: Build site
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check the ref
        env:
          REF: ${{ inputs.ref }}
        run: |
          case "$REF" in
            refs/pull/*|pull/*)
              printf 'Refusing to publish docs from pull request ref %q; merge it first.\n' "$REF" >&2
              exit 1
              ;;
          esac

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false

      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json

      - name: Build
        run: dotnet build Caesar.slnx --configuration Release

      - name: Build docs
        run: |
          dotnet tool restore
          dotnet docfx docs/docfx.json --warningsAsErrors

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: docs-site
          path: docs/_site
          if-no-files-found: error
          include-hidden-files: true
          overwrite: true

  publish:
    name: Publish to gh-pages
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write   # push to gh-pages
    steps:
      # The publishing script comes from the workflow's own commit. This checkout keeps its credentials because the
      # gh-pages push below uses them; nothing from the requested ref runs in this job.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: docs-site
          path: ${{ runner.temp }}/site

      - name: Check out gh-pages
        run: |
          if git ls-remote --exit-code --heads origin gh-pages >/dev/null; then
            git fetch --depth 1 origin gh-pages
            git worktree add -B gh-pages "$RUNNER_TEMP/pages" origin/gh-pages
          else
            git worktree add --orphan -b gh-pages "$RUNNER_TEMP/pages"
          fi

      - name: Publish version
        env:
          VERSION: ${{ inputs.version }}
        run: |
          MINOR=$(python3 .github/scripts/publish_version.py --site "$RUNNER_TEMP/site" --pages "$RUNNER_TEMP/pages" --version "$VERSION")
          echo "MINOR=$MINOR" >> "$GITHUB_ENV"

      - name: Commit and push
        working-directory: ${{ runner.temp }}/pages
        env:
          REF: ${{ inputs.ref }}
        run: |
          git add -A
          if git diff --cached --quiet; then
            echo "Docs $MINOR unchanged; nothing to publish."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git commit -m "docs: publish $MINOR from $REF"
          git push origin gh-pages
