name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    name: Build & Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json

      - name: Restore
        run: dotnet restore Caesar.slnx

      - name: Build
        run: dotnet build Caesar.slnx --configuration Release --no-restore

      - name: Test
        run: dotnet test Caesar.slnx --configuration Release --no-build --logger "trx;LogFileName=results.trx" --results-directory artifacts/test-results

      - name: Pack
        run: dotnet pack Caesar.slnx --configuration Release --no-build --output artifacts/packages

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: artifacts
          path: artifacts

  docs:
    name: Docs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json

      - name: Script tests
        run: python3 -m unittest discover -s .github/scripts -p "test_*.py" -v

      - name: Build
        run: dotnet build Caesar.slnx --configuration Release

      - name: Build docs
        run: |
          dotnet tool restore
          dotnet docfx docs/docfx.json --warningsAsErrors
