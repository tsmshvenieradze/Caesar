name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    name: Build & Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1
        with:
          global-json-file: global.json

      - name: Restore
        run: dotnet restore Caesar.slnx

      - name: Build
        run: dotnet build Caesar.slnx --configuration Release --no-restore

      - name: Test
        run: dotnet test Caesar.slnx --configuration Release --no-build --logger "trx;LogFileName=results.trx" --results-directory artifacts/test-results

      - name: Pack
        run: dotnet pack Caesar.slnx --configuration Release --no-build --output artifacts/packages

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: artifacts
          path: artifacts

  docs:
    name: Docs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1
        with:
          global-json-file: global.json

      - name: Script tests
        run: python3 -m unittest discover -s .github/scripts -p "test_*.py" -v

      - name: Build
        run: dotnet build Caesar.slnx --configuration Release

      - name: Build docs
        run: |
          dotnet tool restore
          dotnet docfx docs/docfx.json --warningsAsErrors
