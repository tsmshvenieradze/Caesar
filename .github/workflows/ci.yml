name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    name: Build & Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Restore
        run: dotnet restore Caesar.slnx

      - name: Build
        run: dotnet build Caesar.slnx --configuration Release --no-restore

      - name: Test
        run: dotnet test Caesar.slnx --configuration Release --no-build --logger "trx;LogFileName=results.trx" --results-directory artifacts/test-results

      - name: Pack
        run: dotnet pack Caesar.slnx --configuration Release --no-build --output artifacts/packages

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: artifacts
          path: artifacts

  docs:
    name: Docs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Script tests
        run: python3 -m unittest discover -s .github/scripts -p "test_*.py" -v

      - name: Build
        run: dotnet build Caesar.slnx --configuration Release

      - name: Build docs
        run: |
          dotnet tool restore
          dotnet docfx docs/docfx.json --warningsAsErrors
