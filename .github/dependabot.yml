version: 2
updates:
  # Workflows pin every action to a commit SHA with a "# vX.Y.Z" comment; Dependabot updates both.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]

  # Central package management: Dependabot edits the versions in Directory.Packages.props.
  - package-ecosystem: nuget
    directory: /
    schedule:
      interval: weekly
    ignore:
      # The major version tracks the targeted .NET version, so the Microsoft.* packages move to a new major only
      # together with the target framework, by hand.
      - dependency-name: "Microsoft.Extensions.*"
        update-types: ["version-update:semver-major"]
      - dependency-name: "Microsoft.SourceLink.*"
        update-types: ["version-update:semver-major"]
    groups:
      test:
        patterns: ["xunit*", "Microsoft.NET.Test.Sdk", "Moq"]
